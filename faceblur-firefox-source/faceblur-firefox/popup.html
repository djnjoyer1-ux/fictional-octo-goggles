<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body><h1>FaceBlur</h1>
<label class="switch"><input id="enabled" type="checkbox"><span>Enable face blur</span></label>
<label>Blur strength <output id="blurOut"></output><input id="blur" type="range" min="6" max="40" step="1"></label>
<label>Detection sensitivity <output id="thresholdOut"></output><input id="threshold" type="range" min="0.2" max="0.8" step="0.05"></label>
<label>Mask size <output id="maskOut"></output><input id="maskScale" type="range" min="1" max="2" step="0.05"></label>
<button id="rescan">Rescan page</button><p>Detection runs locally. Images are not uploaded.</p><script src="popup.js"></script></body></html>
